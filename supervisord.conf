[program:tellbook-api]
directory=/home/iycodes/apps/tellbook-server
command=/home/iycodes/apps/tellbook-server/bin/tellbook-api
user=iycodes
environment=APP_ENV="production",PROCESS_ROLE="api",HTTP_ADDR="127.0.0.1:8200"
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true
umask=0027
redirect_stderr=true
stdout_logfile=/var/log/supervisor/tellbook-api.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

