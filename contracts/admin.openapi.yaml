    "/businesses/{id}/decisions": {
      "post": {
        "operationId": "decideBusiness",
        "summary": "Record a business verification or restriction decision",
        "description": "Requires businesses.manage. Reason required. Verification requires reviewed evidence references. Expected profile timestamp prevents stale decisions; request key makes retries idempotent. Restriction preserves listing preference, existing bookings, login and payouts.",
        "security": [
          {
            "staffSession": []
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "ok": {
                      "type": "boolean"
                    }
                  },
                  "required": [
                    "ok"
                  ]
                }
              }
            }
          },
          "default": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "action": {
                    "type": "string",
                    "enum": [
                      "verify",
                      "reject",
                      "restrict",
                      "restore"
                    ]
                  },
                  "reason": {
