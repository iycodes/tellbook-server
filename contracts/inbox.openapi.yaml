openapi: 3.0.3
info:
  title: Tellbook Native Inbox API
  version: 2.3.0
  description: Native Tellbook messaging, pre-booking conversations, versioned presentations, and AI authority contracts.
servers:
  - url: /v1
paths:
  /marketplace/conversations:
    get:
      operationId: listMarketplaceConversations
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Query' }
      responses:
        '200': { $ref: '#/components/responses/ConversationList' }
        default: { $ref: '#/components/responses/Error' }
  /marketplace/bookings/{bookingID}/conversation:
    post:
      operationId: getOrCreateMarketplaceBookingConversation
      parameters: [{ $ref: '#/components/parameters/BookingID' }]
      responses:
        '200': { $ref: '#/components/responses/ConversationDetail' }
        '201': { $ref: '#/components/responses/ConversationDetail' }
        default: { $ref: '#/components/responses/Error' }
  /marketplace/providers/{providerID}/conversation:
    post:
      operationId: getOrCreateMarketplaceProviderConversation
      description: Idempotently opens the authenticated customer's Tellbook conversation with a marketplace-enabled provider before a booking exists.
      parameters: [{ $ref: '#/components/parameters/ProviderID' }]
      responses:
        '200': { $ref: '#/components/responses/ConversationDetail' }
        '201': { $ref: '#/components/responses/ConversationDetail' }
        default: { $ref: '#/components/responses/Error' }
  /marketplace/conversations/{conversationID}:
    get:
      operationId: getMarketplaceConversation
      parameters: [{ $ref: '#/components/parameters/ConversationID' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/ConversationDetail' }
        default: { $ref: '#/components/responses/Error' }
  /marketplace/conversations/{conversationID}/messages:
    get:
      operationId: listOlderMarketplaceMessages
      parameters:
        - { $ref: '#/components/parameters/ConversationID' }
        - { $ref: '#/components/parameters/Before' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/MessagePage' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: sendMarketplaceMessage
      parameters: [{ $ref: '#/components/parameters/ConversationID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
      responses:
        '200':
          description: Idempotent replay of an already committed message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendMessageResponse' }
        '201':
          description: Message committed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendMessageResponse' }
        default: { $ref: '#/components/responses/Error' }
  /marketplace/conversations/{conversationID}/read:
    post:
      operationId: markMarketplaceConversationRead
      parameters: [{ $ref: '#/components/parameters/ConversationID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarkReadRequest' }
      responses:
        '200':
          description: Authoritative participant state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParticipantState' }
        default: { $ref: '#/components/responses/Error' }
  /marketplace/conversations/{conversationID}/ai-handoff:
    post:
      operationId: customerInboxAIHandoff
      description: Immediately fences automated replies until an explicit provider action resumes the conversation.
      parameters: [{ $ref: '#/components/parameters/ConversationID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerAIHandoffCommand' }
      responses:
        '200':
          description: Handoff is active. Replays return the original effective time.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerAIHandoffResult' }
        default: { $ref: '#/components/responses/Error' }
  /marketplace/conversations/{conversationID}/ai-booking:
    get:
      operationId: getMarketplaceInboxAIBookingWorkflow
      description: Returns the authenticated customer's current canonical in-chat booking state. No reservation is created by this read.
      parameters: [{ $ref: '#/components/parameters/ConversationID' }]
      responses:
        '200':
          description: Current in-chat booking workflow.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxAIBookingWorkflow' }
        default: { $ref: '#/components/responses/Error' }
  /marketplace/conversations/{conversationID}/ai-booking/start:
    post:
      operationId: startMarketplaceInboxAIBooking
      parameters: [{ $ref: '#/components/parameters/ConversationID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartInboxAIBookingRequest' }
      responses:
        '200':
          description: Canonical service choices were committed to the conversation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxAIBookingActionResult' }
        default: { $ref: '#/components/responses/Error' }
  /marketplace/conversations/{conversationID}/ai-booking/availability:
    post:
      operationId: offerMarketplaceInboxAIAvailability
      parameters: [{ $ref: '#/components/parameters/ConversationID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OfferInboxAIAvailabilityRequest' }
      responses:
        '200':
          description: Versioned canonical availability choices were committed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxAIBookingActionResult' }
        default: { $ref: '#/components/responses/Error' }
  /marketplace/conversations/{conversationID}/ai-booking/proposals:
    post:
      operationId: prepareMarketplaceInboxAIBookingProposal
      parameters: [{ $ref: '#/components/parameters/ConversationID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrepareInboxAIBookingProposalRequest' }
      responses:
        '200':
          description: An expiring canonical quote and immutable proposal card were committed. No reservation was created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxAIBookingActionResult' }
        default: { $ref: '#/components/responses/Error' }
  /marketplace/conversations/{conversationID}/ai-booking/proposals/{proposalID}/agreement:
    post:
      operationId: acceptMarketplaceInboxAIBookingAgreement
      parameters:
        - { $ref: '#/components/parameters/ConversationID' }
        - { $ref: '#/components/parameters/ProposalID' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptInboxAIBookingAgreementRequest' }
      responses:
        '200':
          description: Authenticated customer-created agreement evidence was stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxAIBookingActionResult' }
        default: { $ref: '#/components/responses/Error' }
  /marketplace/conversations/{conversationID}/ai-booking/proposals/{proposalID}/confirm:
    post:
      operationId: confirmMarketplaceInboxAIBookingProposal
      description: Records immutable authenticated evidence and idempotently consumes the exact current proposal through the canonical booking application service.
      parameters:
        - { $ref: '#/components/parameters/ConversationID' }
        - { $ref: '#/components/parameters/ProposalID' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmInboxAIBookingProposalRequest' }
      responses:
        '200':
          description: The exact proposal created one reservation, or an identical replay returned that reservation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxAIBookingConfirmationResult' }
        default: { $ref: '#/components/responses/Error' }
  /marketplace/conversations/unread-count:
    get:
      operationId: getMarketplaceUnreadCount
      responses:
        '200': { $ref: '#/components/responses/UnreadCount' }
        default: { $ref: '#/components/responses/Error' }
  /marketplace/conversations/events:
    get:
      operationId: streamMarketplaceInboxEvents
      parameters: [{ $ref: '#/components/parameters/After' }]
      responses:
        '200': { $ref: '#/components/responses/EventStream' }
        default: { $ref: '#/components/responses/Error' }
  /app/inbox/conversations:
    get:
      operationId: listProviderConversations
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - name: state
          in: query
          schema: { type: string, enum: [all, unread, archived] }
        - { $ref: '#/components/parameters/Query' }
      responses:
        '200': { $ref: '#/components/responses/ConversationList' }
        default: { $ref: '#/components/responses/Error' }
  /app/inbox/conversations/{conversationID}:
    get:
      operationId: getProviderConversation
      parameters: [{ $ref: '#/components/parameters/ConversationID' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { $ref: '#/components/responses/ConversationDetail' }
        default: { $ref: '#/components/responses/Error' }
  /app/inbox/conversations/{conversationID}/messages:
    get:
      operationId: listOlderProviderMessages
      parameters:
        - { $ref: '#/components/parameters/ConversationID' }
        - { $ref: '#/components/parameters/Before' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/MessagePage' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: sendProviderMessage
      parameters: [{ $ref: '#/components/parameters/ConversationID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
      responses:
        '200':
          description: Idempotent replay of an already committed message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendMessageResponse' }
        '201':
          description: Message committed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendMessageResponse' }
        default: { $ref: '#/components/responses/Error' }
  /app/inbox/conversations/{conversationID}/ai-drafts:
    post:
      operationId: generateProviderInboxAIDraft
      description: Queues an auditable draft for provider review. This operation never sends a message or mutates a booking.
      parameters: [{ $ref: '#/components/parameters/ConversationID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateAIDraftRequest' }
      responses:
        '200':
          description: Idempotent replay of an already completed draft request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIDraftResponse' }
        '202':
          description: AI reply draft accepted for durable background generation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIDraftResponse' }
        default: { $ref: '#/components/responses/Error' }
  /app/inbox/ai-policy:
    get:
      operationId: getProviderInboxAIPolicy
      responses:
        '200':
          description: Provider policy, rollout availability, and bounded published-service choices.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxAIPolicy' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: updateProviderInboxAIPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateInboxAIPolicyRequest' }
      responses:
        '200':
          description: Updated provider policy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxAIPolicy' }
        default: { $ref: '#/components/responses/Error' }
  /app/inbox/conversations/{conversationID}/ai-control:
    get:
      operationId: getProviderInboxAIControl
      parameters: [{ $ref: '#/components/parameters/ConversationID' }]
      responses:
        '200':
          description: Effective per-conversation mode and takeover state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxAIConversationControl' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: updateProviderInboxAIControl
      parameters: [{ $ref: '#/components/parameters/ConversationID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateInboxAIConversationControlRequest' }
      responses:
        '200':
          description: Updated control. Takeover and pause fence older sessions transactionally.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxAIConversationControl' }
        default: { $ref: '#/components/responses/Error' }
  /app/inbox/conversations/{conversationID}/ai-session:
    get:
      operationId: getProviderInboxAISession
      parameters: [{ $ref: '#/components/parameters/ConversationID' }]
      responses:
        '200':
          description: Current bounded structured workflow state, when one exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxAISessionResponse' }
        default: { $ref: '#/components/responses/Error' }
  /app/inbox/conversations/{conversationID}/ai-drafts/{runID}/discard:
    post:
      operationId: discardProviderInboxAIDraft
      description: Records that a provider rejected a draft or that its source conversation became stale.
      parameters:
        - { $ref: '#/components/parameters/ConversationID' }
        - name: runID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiscardAIDraftRequest' }
      responses:
        '204': { description: Draft outcome recorded. }
        default: { $ref: '#/components/responses/Error' }
  /app/inbox/conversations/{conversationID}/ai-drafts/{runID}:
    get:
      operationId: getProviderInboxAIDraft
      description: Reads the authoritative status and result of a queued AI reply draft.
      parameters:
        - { $ref: '#/components/parameters/ConversationID' }
        - name: runID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current AI reply draft state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIDraftResponse' }
        default: { $ref: '#/components/responses/Error' }
  /app/inbox/conversations/{conversationID}/read:
    post:
      operationId: markProviderConversationRead
      parameters: [{ $ref: '#/components/parameters/ConversationID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarkReadRequest' }
      responses:
        '200':
          description: Authoritative participant state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParticipantState' }
        default: { $ref: '#/components/responses/Error' }
  /app/inbox/conversations/{conversationID}/archive:
    post:
      operationId: archiveProviderConversation
      parameters: [{ $ref: '#/components/parameters/ConversationID' }]
      responses:
        '200':
          description: Authoritative participant state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParticipantState' }
        default: { $ref: '#/components/responses/Error' }
  /app/inbox/conversations/{conversationID}/unarchive:
    post:
      operationId: unarchiveProviderConversation
      parameters: [{ $ref: '#/components/parameters/ConversationID' }]
      responses:
        '200':
          description: Authoritative participant state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParticipantState' }
        default: { $ref: '#/components/responses/Error' }
  /app/inbox/unread-count:
    get:
      operationId: getProviderUnreadCount
      responses:
        '200': { $ref: '#/components/responses/UnreadCount' }
        default: { $ref: '#/components/responses/Error' }
  /app/inbox/events:
    get:
      operationId: streamProviderInboxEvents
      parameters: [{ $ref: '#/components/parameters/After' }]
      responses:
        '200': { $ref: '#/components/responses/EventStream' }
        default: { $ref: '#/components/responses/Error' }
components:
  parameters:
    ConversationID:
      name: conversationID
      in: path
      required: true
      schema: { type: string, format: uuid }
    BookingID:
      name: bookingID
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProposalID:
      name: proposalID
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProviderID:
      name: providerID
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Before:
      name: before
      in: query
      required: true
      schema: { type: string }
    After:
      name: after
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    Query:
      name: query
      in: query
      schema: { type: string, maxLength: 160 }
  responses:
    ConversationList:
      description: Bounded conversation list snapshot.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ConversationListResponse' }
    ConversationDetail:
      description: Authorized bounded conversation snapshot.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ConversationDetailResponse' }
    MessagePage:
      description: Bounded message page.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MessagePageResponse' }
    UnreadCount:
      description: Authoritative unread count snapshot.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/UnreadCountResponse' }
    EventStream:
      description: Authenticated inbox event stream.
      content:
        text/event-stream:
          schema: { type: string }
    Error:
      description: Structured API error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/APIErrorResponse' }
  schemas:
    ActorType: { type: string, enum: [provider, marketplace_customer, ai, system] }
    Channel: { type: string, enum: [tellbook] }
    InboxAIMode:
      type: string
      description: The provider-controlled inbox mode. Manual is the required default.
      enum: [manual, semi_pilot, autopilot]
    InboxAISessionState:
      type: string
      enum:
        - qualifying
        - service_identified
        - link_ready
        - link_sent
        - collecting_preferences
        - collecting_customer_details
        - offering_slots
        - preparing_proposal
        - awaiting_before_booking_agreement
        - awaiting_confirmation
        - creating_reservation
        - reservation_created
        - awaiting_payment
        - awaiting_after_payment_agreement
        - awaiting_provider_confirmation
        - completed
        - handoff
        - provider_takeover
        - expired
        - failed
    InboxAIActionName:
      type: string
      description: Version-one audited read actions and customer-authorized commands. Reservation confirmation is not a model tool.
      enum:
        - list_relevant_services
        - get_service_details
        - get_booking_link
        - search_availability
        - get_booking_requirements
        - refresh_booking_proposal
        - confirm_booking_proposal
        - customer_handoff
    InboxAIServiceOption:
      type: object
      additionalProperties: false
      required: [id, title, fulfillment_mode, currency_code, base_amount_minor, enabled, eligible_modes]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        fulfillment_mode: { type: string, enum: [provider_location, customer_location, virtual] }
        currency_code: { type: string, pattern: '^[A-Z]{3}$' }
        base_amount_minor: { type: integer, format: int64, minimum: 0 }
        enabled: { type: boolean }
        eligible_modes:
          type: array
          uniqueItems: true
          items: { type: string, enum: [semi_pilot, autopilot] }
        autopilot_block_reason: { type: string }
    InboxAIPolicy:
      type: object
      additionalProperties: false
      required: [default_mode, enabled_service_ids, paused, max_turns, inactivity_timeout_minutes, revision, automation_available, services]
      properties:
        default_mode: { $ref: '#/components/schemas/InboxAIMode' }
        enabled_service_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
        paused: { type: boolean }
        max_turns: { type: integer, minimum: 1, maximum: 30 }
        inactivity_timeout_minutes: { type: integer, minimum: 5, maximum: 1440 }
        revision: { type: integer, format: int64, minimum: 0 }
        automation_available: { type: boolean }
        services:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/InboxAIServiceOption' }
        updated_at: { type: string, format: date-time }
    UpdateInboxAIPolicyRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, default_mode, enabled_service_ids, paused, max_turns, inactivity_timeout_minutes]
      properties:
        expected_revision: { type: integer, format: int64, minimum: 0 }
        default_mode: { $ref: '#/components/schemas/InboxAIMode' }
        enabled_service_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
        paused: { type: boolean }
        max_turns: { type: integer, minimum: 1, maximum: 30 }
        inactivity_timeout_minutes: { type: integer, minimum: 5, maximum: 1440 }
    InboxAIConversationControl:
      type: object
      additionalProperties: false
      required: [conversation_id, configured_mode, effective_mode, state, policy_revision, revision]
      properties:
        conversation_id: { type: string, format: uuid }
        mode_override: { $ref: '#/components/schemas/InboxAIMode' }
        configured_mode: { $ref: '#/components/schemas/InboxAIMode' }
        effective_mode: { $ref: '#/components/schemas/InboxAIMode' }
        state: { type: string, enum: [active, paused, provider_takeover, handoff] }
        reason: { type: string, maxLength: 500 }
        policy_revision: { type: integer, format: int64, minimum: 0 }
        revision: { type: integer, format: int64, minimum: 0 }
        updated_at: { type: string, format: date-time }
    UpdateInboxAIConversationControlRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, mode_override, state, reason]
      properties:
        expected_revision: { type: integer, format: int64, minimum: 0 }
        mode_override: { type: string, enum: ['', manual, semi_pilot, autopilot] }
        state: { type: string, enum: [active, paused, provider_takeover] }
        reason: { type: string, maxLength: 500 }
    InboxAISession:
      type: object
      additionalProperties: false
      required: [id, conversation_id, mode, state, last_processed_message_sequence, booking_link_revision, policy_revision, control_revision, turn_count, max_turns, revision, expires_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        mode: { type: string, enum: [semi_pilot, autopilot] }
        state: { $ref: '#/components/schemas/InboxAISessionState' }
        selected_service_id: { type: string, format: uuid }
        last_processed_message_sequence: { type: integer, format: int64, minimum: 0 }
        booking_link_url: { type: string, maxLength: 1000 }
        booking_link_revision: { type: integer, format: int64, minimum: 0 }
        policy_revision: { type: integer, format: int64, minimum: 1 }
        control_revision: { type: integer, format: int64, minimum: 0 }
        turn_count: { type: integer, minimum: 0 }
        max_turns: { type: integer, minimum: 1, maximum: 30 }
        handoff_reason: { type: string, maxLength: 500 }
        revision: { type: integer, format: int64, minimum: 1 }
        expires_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    InboxAISessionResponse:
      type: object
      additionalProperties: false
      required: [session]
      properties:
        session:
          allOf: [{ $ref: '#/components/schemas/InboxAISession' }]
          nullable: true
    InboxAIBookingRequirements:
      type: object
      additionalProperties: false
      required: [missing_customer_fields, customer_location_required, agreement_required, email_reminder_default, whatsapp_reminder_default]
      properties:
        missing_customer_fields:
          type: array
          uniqueItems: true
          items: { type: string, enum: [full_name, email, phone] }
        customer_location_required: { type: boolean }
        agreement_required: { type: boolean }
        email_reminder_default: { type: boolean }
        whatsapp_reminder_default: { type: boolean }
        agreement_title: { type: string }
        agreement_confirmation_method: { type: string, enum: [confirmation, signature] }
