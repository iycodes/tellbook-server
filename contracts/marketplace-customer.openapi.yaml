openapi: 3.1.0
info:
  title: Tellbook Marketplace Customer Data API
  version: 1.0.0
servers:
  - url: /v1/marketplace
security:
  - marketplaceSession: []
paths:
  /auth/capabilities:
    get:
      operationId: getMarketplaceAuthCapabilities
      security: []
      responses:
        '200':
          description: Currently available marketplace sign-in methods.
          content:
            application/json:
              schema: { $ref: './auth.schemas.yaml#/components/schemas/AuthCapabilities' }
  /auth/code:
    post:
      operationId: startMarketplaceAuthCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './auth.schemas.yaml#/components/schemas/CodeStartInput' }
      responses:
        '202': { $ref: '#/components/responses/AuthChallengeAccepted' }
        '400': { $ref: '#/components/responses/BadAuthRequest' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }
  /auth/code/{challengeID}:
    get:
      operationId: getMarketplaceAuthCodeStatus
      security: []
      parameters:
        - name: challengeID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/AuthChallengeReady' }
        '400': { $ref: '#/components/responses/BadAuthRequest' }
  /auth/code/resend:
    post:
      operationId: resendMarketplaceAuthCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './auth.schemas.yaml#/components/schemas/CodeResendInput' }
      responses:
        '202': { $ref: '#/components/responses/AuthChallengeAccepted' }
        '400': { $ref: '#/components/responses/BadAuthRequest' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }
  /auth/verify:
    post:
      operationId: verifyMarketplaceAuthCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './auth.schemas.yaml#/components/schemas/CodeVerifyInput' }
      responses:
        '200':
          description: Marketplace session created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplaceCodeSessionResponse' }
        '400': { $ref: '#/components/responses/BadAuthRequest' }
  /auth/password:
    post:
      operationId: marketplacePasswordSignIn
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './auth.schemas.yaml#/components/schemas/PasswordSignInInput' }
      responses:
        '200':
          description: Marketplace session created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplaceSessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/password/reset/code:
    post:
      operationId: startMarketplacePasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './auth.schemas.yaml#/components/schemas/PasswordResetStartInput' }
      responses:
        '202': { $ref: '#/components/responses/AuthChallengeAccepted' }
        '400': { $ref: '#/components/responses/BadAuthRequest' }
        '429': { $ref: '#/components/responses/AuthRateLimited' }
  /auth/password/reset/verify:
    post:
      operationId: verifyMarketplacePasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './auth.schemas.yaml#/components/schemas/PasswordResetVerifyInput' }
      responses:
        '200':
          description: Single-use reset grant.
          content:
            application/json:
              schema: { $ref: './auth.schemas.yaml#/components/schemas/PasswordResetVerifyResponse' }
        '400': { $ref: '#/components/responses/BadAuthRequest' }
  /auth/password/reset:
    post:
      operationId: completeMarketplacePasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './auth.schemas.yaml#/components/schemas/PasswordResetCompleteInput' }
      responses:
        '200':
          description: Password updated and a replacement session created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplaceSessionResponse' }
        '400': { $ref: '#/components/responses/BadAuthRequest' }
  /auth/session:
    get:
      operationId: getMarketplaceSession
      security: []
      responses:
        '200':
          description: Current marketplace session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplaceSessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: refreshMarketplaceSession
      security: []
      responses:
        '200':
          description: Current marketplace session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplaceSessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      operationId: logoutMarketplace
      security: []
      responses:
        '204': { description: Marketplace session ended. }
  /me/identities/code:
    post:
      operationId: startMarketplaceIdentityLink
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './auth.schemas.yaml#/components/schemas/CodeStartInput' }
      responses:
        '202': { $ref: '#/components/responses/AuthChallengeAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/identities/code/{challengeID}:
    get:
      operationId: getMarketplaceIdentityLinkStatus
      parameters:
        - name: challengeID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/AuthChallengeReady' }
        '400': { $ref: '#/components/responses/BadAuthRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/identities/code/resend:
    post:
      operationId: resendMarketplaceIdentityLink
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './auth.schemas.yaml#/components/schemas/CodeResendInput' }
      responses:
        '202': { $ref: '#/components/responses/AuthChallengeAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/identities/verify:
    post:
      operationId: verifyMarketplaceIdentityLink
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './auth.schemas.yaml#/components/schemas/CodeVerifyInput' }
      responses:
        '200':
          description: Identity linked to the current customer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplaceIdentityLinkResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/BadAuthRequest' }
  /me/password:
    patch:
      operationId: updateMarketplacePassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './auth.schemas.yaml#/components/schemas/PasswordUpdateInput' }
      responses:
        '200':
          description: Password updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplacePasswordResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/notification-preferences:
    get:
      operationId: getMarketplaceNotificationPreferences
      responses:
        '200':
          description: Customer notification preferences filtered by real channel capability.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferencesResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      operationId: updateMarketplaceNotificationPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPreferencesInput' }
      responses:
        '200':
          description: Updated customer notification preferences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferencesResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /bookings/claims:
    post:
      operationId: claimMarketplaceBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [booking_token]
              properties:
                booking_token: { type: string, minLength: 1 }
      responses:
        '200':
          description: Booking atomically linked to the matching verified customer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingClaimResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Verified customer identity does not match the booking contact. }
        '409': { description: Booking is already owned by another customer. }
  /bookings/{bookingID}:
    get:
      operationId: getMarketplaceBooking
      parameters:
        - name: bookingID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Owned booking detail including committed notification delivery state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplaceBookingDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Booking is not owned by the current customer. }
  /saved-providers:
    get:
      operationId: listMarketplaceSavedProviders
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Saved marketplace providers joined to current discovery data.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedProviderList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /saved-providers/{providerID}:
    parameters:
      - $ref: '#/components/parameters/ProviderID'
    get:
      operationId: getMarketplaceProviderSaved
      responses:
        '200':
          description: Current customer's saved state for the provider.
          content:
            application/json:
              schema:
                type: object
                required: [saved]
                properties: { saved: { type: boolean } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      operationId: saveMarketplaceProvider
      responses:
        '204': { description: Provider is saved; repeated requests are idempotent. }
        '404': { description: Provider does not exist or is not marketplace-visible. }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: removeMarketplaceSavedProvider
      responses:
        '204': { description: Provider is not saved; repeated requests are idempotent. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /notifications:
    get:
      operationId: listMarketplaceNotifications
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/NotificationKind' }
        - name: unread_only
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Cursor-paged customer notifications and the total unread count.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /notifications/read-all:
    post:
      operationId: markAllMarketplaceNotificationsRead
      responses:
        '204': { description: Every current unread notification was marked read. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /notifications/{notificationID}/read:
    parameters:
      - name: notificationID
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: markMarketplaceNotificationRead
      responses:
        '204': { description: Notification was marked read. }
        '404': { description: Notification does not belong to this customer. }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    marketplaceSession:
      type: apiKey
      in: cookie
      name: tellbook_marketplace_session
  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 24 }
    ProviderID:
      name: providerID
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    AuthChallengeAccepted:
      description: Challenge accepted without disclosing account existence.
      content:
        application/json:
          schema: { $ref: './auth.schemas.yaml#/components/schemas/ChallengeResponse' }
    AuthChallengeReady:
      description: Current delivery and verification state for the challenge.
      content:
        application/json:
          schema: { $ref: './auth.schemas.yaml#/components/schemas/ChallengeResponse' }
    BadAuthRequest:
      description: Invalid authentication request.
      content:
        application/json:
          schema: { $ref: './auth.schemas.yaml#/components/schemas/Error' }
    AuthRateLimited:
      description: Authentication request limit reached.
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content:
        application/json:
          schema: { $ref: './auth.schemas.yaml#/components/schemas/Error' }
    Unauthorized:
      description: Marketplace customer session is missing or invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    MarketplaceCustomer:
      type: object
      additionalProperties: false
      required: [id, full_name, has_password, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string }
        email: { type: string, format: email }
        phone: { type: string, pattern: '^\\+[1-9][0-9]{9,14}$' }
        email_verified_at: { type: string, format: date-time }
        phone_verified_at: { type: string, format: date-time }
        birthday: { type: string, format: date }
        has_password: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MarketplaceSessionResponse:
      type: object
      additionalProperties: false
      required: [customer]
      properties:
        customer: { $ref: '#/components/schemas/MarketplaceCustomer' }
    MarketplaceCodeSessionResponse:
      type: object
      additionalProperties: false
      required: [customer, is_new_account, onboarding_required]
      properties:
        customer: { $ref: '#/components/schemas/MarketplaceCustomer' }
        is_new_account: { type: boolean }
        onboarding_required: { type: boolean }
    MarketplacePasswordInput:
      type: object
      additionalProperties: false
      required: [new_password]
      properties:
        current_password: { type: string, maxLength: 72 }
        new_password: { type: string, minLength: 8, maxLength: 72 }
    MarketplacePasswordResponse:
      type: object
      additionalProperties: false
      required: [message, customer, reauthentication_required]
      properties:
        message: { type: string }
        customer: { $ref: '#/components/schemas/MarketplaceCustomer' }
        reauthentication_required: { type: boolean, const: true }
    MarketplaceIdentityLinkResponse:
      type: object
      additionalProperties: false
      required: [customer, reauthentication_required]
      properties:
        customer: { $ref: '#/components/schemas/MarketplaceCustomer' }
        reauthentication_required: { type: boolean, const: true }
    BookingDeliveryChannelStatus:
      type: object
      additionalProperties: false
      required: [requested, eligible, status]
      properties:
        requested: { type: boolean }
        eligible: { type: boolean }
        status:
          type: string
          enum: [not_requested, pending, accepted, sent, delivered, read, failed, unknown, manual_review, cancelled]
    BookingDeliveryStatus:
      type: object
      additionalProperties: false
      required: [provider_in_app, provider_email, provider_whatsapp, customer_email, customer_whatsapp, customer_sms]
      properties:
        provider_in_app: { $ref: '#/components/schemas/BookingDeliveryChannelStatus' }
        provider_email: { $ref: '#/components/schemas/BookingDeliveryChannelStatus' }
        provider_whatsapp: { $ref: '#/components/schemas/BookingDeliveryChannelStatus' }
        customer_email: { $ref: '#/components/schemas/BookingDeliveryChannelStatus' }
        customer_whatsapp: { $ref: '#/components/schemas/BookingDeliveryChannelStatus' }
        customer_sms: { $ref: '#/components/schemas/BookingDeliveryChannelStatus' }
    NotificationPreferences:
      type: object
      additionalProperties: false
      required: [booking_email, booking_sms, booking_whatsapp, marketing_email, email_available, whatsapp_available, updated_at]
      properties:
        booking_email: { type: boolean }
        booking_sms: { type: boolean }
        booking_whatsapp: { type: boolean }
        marketing_email: { type: boolean }
        email_available: { type: boolean }
        whatsapp_available: { type: boolean }
        updated_at: { type: string, format: date-time }
    NotificationPreferencesInput:
      type: object
      additionalProperties: false
      required: [booking_email, booking_sms, booking_whatsapp, marketing_email]
      properties:
        booking_email: { type: boolean }
        booking_sms: { type: boolean }
        booking_whatsapp: { type: boolean }
        marketing_email: { type: boolean }
    NotificationPreferencesResponse:
      type: object
      additionalProperties: false
      required: [preferences]
      properties:
        preferences: { $ref: '#/components/schemas/NotificationPreferences' }
    BookingClaimResponse:
      type: object
      additionalProperties: false
      required: [booking_id]
      properties:
        booking_id: { type: string, format: uuid }
    MarketplaceBookingDetail:
      type: object
      additionalProperties: true
      required: [id, delivery_status]
      properties:
        id: { type: string, format: uuid }
        provider_contact_phone:
          type: string
          description: Current verified business contact, only when sharing with booked customers is enabled. Access is restricted to the booking owner.
        delivery_status: { $ref: '#/components/schemas/BookingDeliveryStatus' }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    NotificationKind:
      type: string
      enum: [booking, message, offer, system]
    SavedProvider:
      type: object
      required:
        - id
        - handle_slug
        - public_booking_url
        - business_name
        - headline
        - category_id
        - category_name
        - verified
        - review_rating
        - review_count
        - location_label
        - service_id
        - service_slug
        - service_title
        - duration_minutes
        - price_amount_minor
        - currency_code
        - fulfillment_mode
        - completed_bookings
        - badges
        - saved_at
      properties:
        id: { type: string, format: uuid }
        handle_slug: { type: string }
        public_booking_url: { type: string }
        business_name: { type: string }
        headline: { type: string }
        category_id: { type: string, format: uuid }
        category_name: { type: string }
        avatar_url: { type: string }
        hero_image_url: { type: string }
        verified: { type: boolean }
        review_rating: { type: number }
        review_count: { type: integer }
        location_label: { type: string }
        service_id: { type: string, format: uuid }
        service_slug: { type: string }
        service_title: { type: string }
        duration_minutes: { type: integer }
        price_amount_minor: { type: string, pattern: '^-?[0-9]+$' }
        currency_code: { type: string, pattern: '^[A-Z]{3}$' }
        fulfillment_mode:
          type: string
          enum: [provider_location, customer_location, virtual]
        completed_bookings: { type: integer }
        next_available_at: { type: string, format: date-time }
        badges:
          type: array
          items: { type: string }
        saved_at: { type: string, format: date-time }
    SavedProviderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SavedProvider' }
        next_cursor: { type: string }
    Notification:
      type: object
      required: [id, kind, event_type, title, body, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/NotificationKind' }
        event_type: { type: string }
        title: { type: string }
        body: { type: string }
        provider_id: { type: string, format: uuid }
        booking_id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        read_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    NotificationList:
      type: object
      required: [items, unread_count]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        unread_count: { type: integer, minimum: 0 }
        next_cursor: { type: string }
